name: Lab7 Baseline

on:
  push:
    branches:
      - lab7-waleed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Test Surprise import
        run: |
          python -c "import surprise; print('Surprise imported successfully')"